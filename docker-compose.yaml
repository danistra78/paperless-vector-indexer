services:
  # -------------------------------------------------------------------------
  # Indexer (One-Shot): laeuft einmal und beendet sich (z. B. naechtlich per Cron)
  # -------------------------------------------------------------------------
  indexer:
    build: .
    image: paperless-vector-indexer
    command: python main.py
    restart: "no"
    # Alle Werte und Schluessel stehen in .env (Vorlage: .env.example).
    # Nie Tokens hier eintragen - dieses Repository ist oeffentlich.
    env_file: .env

  # -------------------------------------------------------------------------
  # API: Suche, Dokument-Metadaten und POST /index/<id> fuer Paperless
  # -------------------------------------------------------------------------
  api:
    build: .
    image: paperless-vector-indexer
    command: python api.py
    restart: unless-stopped
    env_file: .env
    environment:
      API_ENABLED: "true"
    ports:
      - "8080:8080"
